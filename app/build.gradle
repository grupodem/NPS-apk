plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

Properties localProperties = new Properties()
File localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
String npsKioskHeader = localProperties.getProperty('npsKioskHeader', '')

android {
    namespace 'com.osamaalek.kiosklauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.osamaalek.kiosklauncher"
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName "1.0.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "NPS_KIOSK_HEADER", "\"${npsKioskHeader}\""
    }

    signingConfigs {
        debug {
            storeFile file('kiosk.keystore')
            storePassword 'kiosk123'
            keyAlias 'kiosk'
            keyPassword 'kiosk123'
        }
        release {
            storeFile file('kiosk.keystore')
            storePassword 'kiosk123'
            keyAlias 'kiosk'
            keyPassword 'kiosk123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig true
    }
}

// Garante que o build de release falhe com mensagem clara se 'npsKioskHeader' não estiver configurado
gradle.taskGraph.whenReady { taskGraph ->
    boolean isReleaseBuild = taskGraph.allTasks.any {
        it.name.toLowerCase().contains("release") && !it.name.toLowerCase().contains("test")
    }
    if (isReleaseBuild) {
        String secret = localProperties.getProperty('npsKioskHeader')
        if (secret == null || secret.trim().isEmpty()) {
            throw new GradleException("ERRO NO BUILD DE RELEASE: A propriedade 'npsKioskHeader' não foi configurada no arquivo local.properties. Adicione a linha 'npsKioskHeader=<SEGREDO>' em local.properties para gerar o build de release assinado.")
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.0-alpha01'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
